<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New — nutrx</title>
  <meta name="description" content="See what's new in nutrx. Every update, every fix, every improvement.">
  <link rel="icon" type="image/png" href="nutrx_icon_1024.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">

  <style>
    .main { max-width: 680px; }

    .page-title {
      font-family: var(--display);
      font-size: clamp(38px, 6vw, 56px);
      font-weight: 400; line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .page-intro {
      font-size: 17px; font-weight: 300;
      color: var(--text-2); line-height: 1.72;
      margin-bottom: 72px;
    }

    /* ─── TIMELINE ─── */
    .timeline {
      position: relative;
      display: flex; flex-direction: column;
      gap: 0;
    }
    .timeline.timeline--status::before { display: none; }

    .timeline::before {
      content: '';
      position: absolute;
      left: 15px; top: 8px; bottom: 0;
      width: 1px;
      background: var(--border-med);
    }

    .timeline-status {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 24px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .timeline-status.loading {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .timeline-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0,122,255,0.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    .timeline-status-body { min-width: 0; }
    .timeline-status-title {
      font-family: var(--display);
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .timeline-status-copy {
      font-size: 14.5px;
      font-weight: 300;
      color: var(--text-2);
      line-height: 1.7;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── RELEASE ─── */
    .release {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 0 24px;
      padding-bottom: 56px;
    }
    .release:last-child { padding-bottom: 0; }

    /* dot */
    .release-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border-med);
      margin-top: 6px;
      position: relative;
      z-index: 1;
      justify-self: center;
      transition: border-color 0.2s;
    }
    .release.latest .release-dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
    }

    /* header */
    .release-header {
      display: flex; align-items: center;
      gap: 12px; margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .release-version {
      font-family: var(--display);
      font-size: 22px; font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .release-date {
      font-size: 13px; font-weight: 400;
      color: var(--text-3);
    }
    .release-badge {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 100px;
    }
    .badge-latest {
      background: rgba(0,122,255,0.1);
      color: var(--accent);
    }

    /* groups */
    .change-groups {
      display: flex; flex-direction: column; gap: 20px;
    }

    .change-group-label {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .label-features { color: var(--accent); }
    .label-improvements { color: var(--green); }
    .label-fixes { color: var(--orange); }

    .change-list {
      display: flex; flex-direction: column; gap: 10px;
    }

    .change-item {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex; gap: 14px; align-items: flex-start;
    }

    .change-icon {
      width: 28px; height: 28px; flex-shrink: 0;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .change-icon svg { width: 14px; height: 14px; }
    .icon-feature { background: rgba(0,122,255,0.08); }
    .icon-improvement { background: rgba(52,199,89,0.1); }
    .icon-fix { background: rgba(255,159,10,0.1); }

    .change-text { flex: 1; }
    .change-title {
      font-size: 14px; font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
    }
    .change-desc {
      font-size: 13.5px; font-weight: 300;
      color: var(--text-2); line-height: 1.58;
    }

    @media (max-width: 600px) {
      .timeline::before { left: 11px; }
      .release { grid-template-columns: 24px 1fr; gap: 0 16px; }
    }
  </style>
</head>

<main class="main">

  <p class="page-eyebrow">What's New</p>
  <h1 class="page-title">Every update,<br>documented.</h1>
  <p class="page-intro">nutrx ships fast and improves constantly. Here's everything that's changed, version by version.</p>

  <div class="timeline" id="timeline"></div>

  <p class="footer-note">
    © 2026 nutrx · <a href="/">Home</a> · <a href="support.html">Support</a> · <a href="privacy.html">Privacy Policy</a>
  </p>

</main>

<script src="assets/site.js"></script>
<script>
  const timeline = document.getElementById('timeline');
  const TYPE_CONFIG = {
    features:     { label: 'Features',     labelClass: 'label-features',     iconClass: 'icon-feature',     stroke: '#007AFF' },
    improvements: { label: 'Improvements', labelClass: 'label-improvements', iconClass: 'icon-improvement', stroke: '#34C759' },
    fixes:        { label: 'Fixes',        labelClass: 'label-fixes',        iconClass: 'icon-fix',         stroke: '#FF9F0A' }
  };
  const FALLBACK_ICONS = {
    features: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    improvements: '<polyline points="4 14 9 9 13 13 20 6"/>',
    fixes: '<path d="M20 6L9 17l-5-5"/>'
  };

  function buildSvg(inner, stroke) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));
  }

  function compareVersions(a, b) {
    const partsA = String(a.version ?? '').split('.').map(Number);
    const partsB = String(b.version ?? '').split('.').map(Number);
    const length = Math.max(partsA.length, partsB.length);

    for (let i = 0; i < length; i += 1) {
      const diff = (partsB[i] || 0) - (partsA[i] || 0);
      if (diff !== 0) return diff;
    }

    return 0;
  }

  function normalizeItems(items) {
    if (!Array.isArray(items)) return [];

    return items
      .filter((item) => item && item.title)
      .map((item) => ({
        title: escapeHtml(item.title),
        desc: escapeHtml(item.desc ?? item.description ?? ''),
        icon: typeof item.icon === 'string' && item.icon.trim() ? item.icon : null
      }));
  }

  function normalizeReleases(payload) {
    const releases = Array.isArray(payload) ? payload : payload?.releases;
    if (!Array.isArray(releases)) return [];

    return releases
      .filter((release) => release && release.version && release.date)
      .map((release) => ({
        version: String(release.version),
        date: escapeHtml(release.date),
        features: normalizeItems(release.features),
        improvements: normalizeItems(release.improvements),
        fixes: normalizeItems(release.fixes)
      }))
      .sort(compareVersions);
  }

  function renderStatus(title, copy, options = {}) {
    const statusClass = options.loading ? 'timeline-status loading' : 'timeline-status';
    const spinner = options.loading ? '<div class="timeline-spinner" aria-hidden="true"></div>' : '';

    timeline.classList.add('timeline--status');
    timeline.innerHTML = `<div class="${statusClass}">
      ${spinner}
      <div class="timeline-status-body">
        <p class="timeline-status-title">${escapeHtml(title)}</p>
        <p class="timeline-status-copy">${escapeHtml(copy)}</p>
      </div>
    </div>`;
  }

  function renderItem(item, type) {
    const cfg = TYPE_CONFIG[type];
    const icon = item.icon || FALLBACK_ICONS[type];
    return `<div class="change-item">
      <div class="change-icon ${cfg.iconClass}">${buildSvg(icon, cfg.stroke)}</div>
      <div class="change-text">
        <p class="change-title">${item.title}</p>
        <p class="change-desc">${item.desc}</p>
      </div>
    </div>`;
  }

  function renderGroup(items, type) {
    if (!items || !items.length) return '';
    const cfg = TYPE_CONFIG[type];
    return `<div>
      <p class="change-group-label ${cfg.labelClass}">${cfg.label}</p>
      <div class="change-list">${items.map(i => renderItem(i, type)).join('')}</div>
    </div>`;
  }

  function renderRelease(release, isLatest) {
    const badge = isLatest ? '<span class="release-badge badge-latest">Current</span>' : '';
    const groups = ['features', 'improvements', 'fixes'].map(t => renderGroup(release[t], t)).join('');
    return `<div class="release${isLatest ? ' latest' : ''}">
      <div class="release-dot"></div>
      <div class="release-body">
        <div class="release-header">
          <span class="release-version">v${release.version}</span>
          <span class="release-date">${release.date}</span>
          ${badge}
        </div>
        <div class="change-groups">${groups}</div>
      </div>
    </div>`;
  }

  async function loadChangelog() {
    renderStatus('Loading changelog…', 'Fetching the latest release notes.', { loading: true });

    try {
      const response = await fetch('changelog.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const payload = await response.json();
      const releases = normalizeReleases(payload);

      if (!releases.length) {
        renderStatus('No release notes yet', 'Add entries to changelog.json to populate this page.');
        return;
      }

      timeline.classList.remove('timeline--status');
      timeline.innerHTML = releases.map((release, index) => renderRelease(release, index === 0)).join('');
    } catch (error) {
      const message = window.location.protocol === 'file:'
        ? 'Open this page through a local web server like python3 -m http.server because browsers block JSON fetches from file URLs.'
        : 'The changelog data could not be loaded right now. Check changelog.json and try again.';

      console.error('Failed to load changelog:', error);
      renderStatus('Unable to load changelog', message);
    }
  }

  loadChangelog();
</script>

</body>
</html>
